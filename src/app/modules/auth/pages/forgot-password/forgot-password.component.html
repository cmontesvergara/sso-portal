<div class="signup-fullscreen">
  <div class="signup-content">
    <div class="step-content">
      <div class="step-header">
        <h1 class="step-title">¿Olvidaste tu contraseña?</h1>
        <p class="step-subtitle">Ingresa tu correo electrónico para restablecer tu contraseña</p>
      </div>

      <form class="step-form" (submit)="onSubmit()">
        <div class="input-group">
          <label class="input-label" for="email">Correo electrónico</label>
          <input 
            [(ngModel)]="email" 
            [ngModelOptions]="{standalone: true}"
            type="email" 
            id="email" 
            class="input-field"
            placeholder="tu@empresa.com" 
          />
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-primary" [disabled]="disabledSendButton">
            Enviar
            <svg class="btn-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M10.293 3.293a1 1 0 011.414 0l6 6a1 1 0 010 1.414l-6 6a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-4.293-4.293a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          </button>
          <button type="button" class="btn-secondary" routerLink="/auth/sign-in">
            <svg class="btn-icon-left" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z"
                clip-rule="evenodd" />
            </svg>
            Cancelar
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <div class="signup-footer">
    <p>Powered by <strong>Bigso Labs</strong> — La plataforma para tu negocio</p>
  </div>
</div>
