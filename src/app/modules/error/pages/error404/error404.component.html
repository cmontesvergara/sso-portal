<div class="signup-fullscreen">
  <div class="signup-content">
    <div class="step-content">
      <div class="error-state">
        <div class="error-icon-wrapper">
          <div class="error-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
          </div>
        </div>
        
        <h1 class="error-title">404</h1>
        <h2 class="error-subtitle">Página no encontrada</h2>
        <p class="error-description">
          Lo sentimos, la página que estás buscando no existe o ha sido movida.
        </p>

        <div class="info-card">
          <p class="info-text">
            <svg viewBox="0 0 20 20" fill="currentColor" style="width: 16px; height: 16px; display: inline-block; vertical-align: middle; margin-right: 4px; margin-top: -2px;">
              <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
            </svg>
            Verifica la URL o regresa al inicio.
          </p>
        </div>

        <div class="btn-group">
          <button type="button" class="btn-primary" (click)="goToHomePage()">
            <svg class="btn-icon-left" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Ir a la página principal
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="signup-footer">
    <p>Powered by <strong>Bigso Labs</strong> — La plataforma para tu negocio</p>
  </div>
</div>
